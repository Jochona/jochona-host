---
name: CI
permissions: {}

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version for this run (e.g. 1.0.0); defaults to a dry-run placeholder on this fork'
        required: false
        type: string
      publish:
        description: 'Create a real GitHub Release for this run (fork only; no effect on LizardByte/)'
        required: false
        type: boolean
        default: false

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  github-env:
    name: GitHub Env Debug
    permissions:
      contents: read
    uses: LizardByte/.github/.github/workflows/__call-github-env.yml@master

  release-setup:
    name: Release Setup
    outputs:
      # Jochona: this fork has no Apple/Azure signing certs or bot tokens, so it never publishes through
      # LizardByte infrastructure; force publish_release=false outside LizardByte/ (matches `release` job gate).
      publish_release: ${{ startsWith(github.repository, 'LizardByte/') && steps.release-setup.outputs.publish_release || 'false' }}
      release_body: >-
        ${{ steps.release-setup.outputs.release_body || steps.manual.outputs.release_body || steps.tag.outputs.release_body }}
      release_commit: >-
        ${{
          steps.release-setup.outputs.release_commit || steps.manual.outputs.release_commit || steps.tag.outputs.release_commit
        }}
      release_generate_release_notes: >-
        ${{
          steps.release-setup.outputs.release_generate_release_notes ||
          steps.manual.outputs.release_generate_release_notes ||
          steps.tag.outputs.release_generate_release_notes
        }}
      release_tag: >-
        ${{ steps.release-setup.outputs.release_tag || steps.manual.outputs.release_tag || steps.tag.outputs.release_tag }}
      release_version: >-
        ${{
          steps.release-setup.outputs.release_version || steps.manual.outputs.release_version || steps.tag.outputs.release_version
        }}
      # Jochona: gates the fork-owned `fork-release` job below. Kept separate from `publish_release`, which stays
      # forced false on this fork so no signing/notarization/Homebrew/Docker publishing is ever attempted.
      fork_release: ${{ steps.fork-release-gate.outputs.fork_release }}
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      # Jochona: LizardByte's release_setup only understands push/pull_request payloads (reads event["commits"]),
      # and crashes with KeyError on workflow_dispatch, or IndexError on tag pushes (which carry zero new commits).
      # Manual runs and tag pushes get local, non-publishing metadata instead.
      - name: Release Setup
        id: release-setup
        if: github.event_name != 'workflow_dispatch' && !startsWith(github.ref, 'refs/tags/')
        uses: LizardByte/actions/actions/release_setup@d0ae7f82215a479fe2b74f4088c53ee6460513dd  # v2026.728.214955
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Release Setup (manual run)
        id: manual
        if: github.event_name == 'workflow_dispatch'
        env:
          INPUT_VERSION: ${{ inputs.version }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          VERSION="${INPUT_VERSION:-0.0.${RUN_NUMBER}}"
          {
            echo "publish_release=false"
            echo "release_body="
            echo "release_commit=${GITHUB_SHA}"
            echo "release_generate_release_notes=false"
            echo "release_tag=v${VERSION}"
            echo "release_version=${VERSION}"
          } >> "${GITHUB_OUTPUT}"

      # Jochona: a `v*` tag push carries the real release version; derive metadata from the tag itself instead of
      # LizardByte's calver release_setup action (see comment above).
      - name: Release Setup (tag push)
        id: tag
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          {
            echo "publish_release=false"
            echo "release_body="
            echo "release_commit=${GITHUB_SHA}"
            echo "release_generate_release_notes=false"
            echo "release_tag=${GITHUB_REF_NAME}"
            echo "release_version=${GITHUB_REF_NAME#v}"
          } >> "${GITHUB_OUTPUT}"

      # Jochona: decide whether the fork-owned `fork-release` job should publish a GitHub Release. Real `v*` tag
      # pushes always do; workflow_dispatch only does when explicitly asked via the `publish` input (so manual
      # runs default to a safe dry run). Never runs in LizardByte/, which uses its own `release` job instead.
      - name: Fork Release Gate
        id: fork-release-gate
        env:
          DISPATCH_PUBLISH: ${{ inputs.publish }}
        run: |
          fork_release="false"
          if [[ "${GITHUB_REPOSITORY}" != LizardByte/* ]]; then
            if [[ "${GITHUB_EVENT_NAME}" == "push" && "${GITHUB_REF}" == refs/tags/v* ]]; then
              fork_release="true"
            elif [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" && "${DISPATCH_PUBLISH}" == "true" ]]; then
              fork_release="true"
            fi
          fi
          echo "fork_release=${fork_release}" >> "${GITHUB_OUTPUT}"

  build-docker:
    name: Docker
    needs: release-setup
    permissions:
      contents: read
      packages: write
    uses: LizardByte/.github/.github/workflows/__call-docker.yml@master
    with:
      docker_hub_username: ${{ vars.DOCKER_HUB_USERNAME }}
      gh_bot_name: ${{ vars.GH_BOT_NAME }}
      maximize_build_space: true
      publish_release: ${{ needs.release-setup.outputs.publish_release }}
      release_commit: ${{ needs.release-setup.outputs.release_commit }}
      release_tag: ${{ needs.release-setup.outputs.release_tag }}
      release_version: ${{ needs.release-setup.outputs.release_version }}
    secrets:
      DOCKER_HUB_PASSWORD: ${{ secrets.DOCKER_HUB_PASSWORD }}
      DOCKER_HUB_ACCESS_TOKEN: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}
      GH_BOT_TOKEN: ${{ secrets.GH_BOT_TOKEN }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-freebsd:
    name: FreeBSD
    needs: release-setup
    permissions:
      contents: read
    uses: ./.github/workflows/ci-freebsd.yml
    with:
      release_commit: ${{ needs.release-setup.outputs.release_commit }}
      release_version: ${{ needs.release-setup.outputs.release_version }}

  build-homebrew:
    name: Homebrew
    if: startsWith(github.repository, 'LizardByte/')  # Jochona: audits the upstream lizardbyte/homebrew tap formula
    needs: release-setup
    permissions:
      contents: read
    uses: ./.github/workflows/ci-homebrew.yml
    with:
      git_username: ${{ vars.GH_BOT_NAME }}
      publish_release: ${{ needs.release-setup.outputs.publish_release }}
      release_commit: ${{ needs.release-setup.outputs.release_commit }}
      release_tag: ${{ needs.release-setup.outputs.release_tag }}
      release_version: ${{ needs.release-setup.outputs.release_version }}
    secrets:
      GH_TOKEN: ${{ secrets.GH_BOT_TOKEN }}
      GIT_EMAIL: ${{ secrets.GH_BOT_EMAIL }}

  build-macos:
    name: macOS
    needs: release-setup
    permissions:
      contents: read
    uses: ./.github/workflows/ci-macos.yml
    with:
      publish_release: ${{ needs.release-setup.outputs.publish_release }}
      release_commit: ${{ needs.release-setup.outputs.release_commit }}
      release_version: ${{ needs.release-setup.outputs.release_version }}
    secrets:
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_NOTARYTOOL_PASSWORD: ${{ secrets.APPLE_NOTARYTOOL_PASSWORD }}
      APPLE_CODESIGN_IDENTITY: ${{ secrets.APPLE_CODESIGN_IDENTITY }}
      APPLE_DEVELOPER_ID_APPLICATION_CERTIFICATE_BASE64: >-
        ${{ secrets.APPLE_DEVELOPER_ID_APPLICATION_CERTIFICATE_BASE64 }}
      APPLE_DEVELOPER_ID_APPLICATION_CERTIFICATE_P12_PASSWORD: >-
        ${{ secrets.APPLE_DEVELOPER_ID_APPLICATION_CERTIFICATE_P12_PASSWORD }}

  build-linux:
    name: Linux
    needs: release-setup
    permissions:
      contents: read
    uses: ./.github/workflows/ci-linux.yml
    with:
      release_commit: ${{ needs.release-setup.outputs.release_commit }}
      release_version: ${{ needs.release-setup.outputs.release_version }}

  build-archlinux:
    name: Archlinux
    needs: release-setup
    permissions:
      contents: read
    uses: ./.github/workflows/ci-archlinux.yml
    with:
      release_commit: ${{ needs.release-setup.outputs.release_commit }}
      release_version: ${{ needs.release-setup.outputs.release_version }}

  build-linux-copr:
    name: Linux Copr
    # releases are handled directly in ci-copr.yml; Copr targets LizardByte's account, so skip on forks
    if: github.event_name != 'push' && startsWith(github.repository, 'LizardByte/')
    needs: release-setup
    permissions:
      contents: write  # needed to update releases
    uses: ./.github/workflows/ci-copr.yml
    secrets:
      COPR_BETA_WEBHOOK_TOKEN: ${{ secrets.COPR_BETA_WEBHOOK_TOKEN }}
      COPR_STABLE_WEBHOOK_TOKEN: ${{ secrets.COPR_STABLE_WEBHOOK_TOKEN }}
      COPR_CLI_CONFIG: ${{ secrets.COPR_CLI_CONFIG }}
      VIRUSTOTAL_API_KEY: ${{ secrets.VIRUSTOTAL_API_KEY }}

  build-linux-flatpak:
    name: Linux Flatpak
    needs: release-setup
    permissions:
      contents: read
    uses: ./.github/workflows/ci-flatpak.yml
    with:
      release_commit: ${{ needs.release-setup.outputs.release_commit }}
      release_version: ${{ needs.release-setup.outputs.release_version }}

  build-windows:
    name: Windows
    needs: release-setup
    permissions:
      contents: read
    uses: ./.github/workflows/ci-windows.yml
    with:
      azure_signing_account: ${{ vars.AZURE_SIGNING_ACCOUNT }}
      azure_signing_cert_profile: ${{ vars.AZURE_SIGNING_CERT_PROFILE }}
      azure_signing_endpoint: ${{ vars.AZURE_SIGNING_ENDPOINT }}
      publish_release: ${{ needs.release-setup.outputs.publish_release }}
      release_commit: ${{ needs.release-setup.outputs.release_commit }}
      release_version: ${{ needs.release-setup.outputs.release_version }}
    secrets:
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}

  bundle-analysis:
    name: Bundle Analysis
    needs: release-setup
    permissions:
      contents: read
    uses: ./.github/workflows/ci-bundle.yml
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  coverage:
    name: Coverage-${{ matrix.name }}
    if: >-
      always() &&
      !cancelled() &&
      startsWith(github.repository, 'LizardByte/')
    needs:
      - build-freebsd
      - build-linux
      - build-archlinux
      - build-linux-flatpak
      - build-macos
      - build-homebrew
      - build-windows
    permissions:
      contents: read
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: FreeBSD-amd64
            coverage: true
            pr: true
          - name: FreeBSD-aarch64
            coverage: true
            pr: false
          - name: Linux-AppImage
            coverage: true
            pr: true
          - name: Archlinux
            coverage: true
            pr: true
          - name: macOS-arm64
            coverage: true
            pr: true
          - name: macOS-x86_64
            coverage: true
            pr: true
          - name: Homebrew-macos-14
            coverage: true
            coverage_file: coverage.lcov
            pr: true
          - name: Homebrew-macos-15
            coverage: true
            coverage_file: coverage.lcov
            pr: true
          - name: Homebrew-macos-26
            coverage: true
            coverage_file: coverage.lcov
            pr: true
          - name: Homebrew-ubuntu-24.04
            coverage: true
            pr: true
          - name: Windows-AMD64
            coverage: true
            pr: true
          - name: Windows-ARM64
            coverage: true
            pr: true
    steps:
      - name: Should run
        id: should_run
        run: |
          should_run="false"
          if [ "${GITHUB_EVENT_NAME}" != "pull_request" ] || [ ${{ matrix.pr }} == "true" ]; then
            should_run="true"
          fi
          echo "SHOULD_RUN=${should_run}" >> "${GITHUB_OUTPUT}"

      - name: Checkout
        if: steps.should_run.outputs.SHOULD_RUN == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Download coverage artifact
        if: steps.should_run.outputs.SHOULD_RUN == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: coverage-${{ matrix.name }}
          path: _coverage

      - name: Upload test coverage
        if: |
          steps.should_run.outputs.SHOULD_RUN == 'true'  &&
          matrix.coverage != false
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f  # v7.0.0
        with:
          disable_search: true
          fail_ci_if_error: true
          files: ./_coverage/${{ matrix.coverage_file || 'coverage.xml' }}
          report_type: coverage
          flags: ${{ matrix.name }}
          token: ${{ secrets.CODECOV_TOKEN }}
          verbose: true

      - name: Upload test results
        if: steps.should_run.outputs.SHOULD_RUN == 'true'
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f  # v7.0.0
        with:
          disable_search: true
          fail_ci_if_error: true
          files: ./_coverage/tests/test_results.xml
          report_type: test_results
          flags: ${{ matrix.name }}
          token: ${{ secrets.CODECOV_TOKEN }}
          verbose: true

  release:
    name: Release
    if:
      needs.release-setup.outputs.publish_release == 'true' &&
      startsWith(github.repository, 'LizardByte/')
    needs:
      - release-setup
      - build-archlinux
      - build-docker
      - build-freebsd
      - build-homebrew
      - build-linux
      - build-linux-flatpak
      - build-macos
      - build-windows
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          path: artifacts
          pattern: build-*
          merge-multiple: true

      - name: Debug artifacts
        run: ls -l artifacts

      - name: Create/Update GitHub Release
        uses: LizardByte/actions/actions/release_create@d0ae7f82215a479fe2b74f4088c53ee6460513dd  # v2026.728.214955
        with:
          allowUpdates: false
          body: ${{ needs.release-setup.outputs.release_body }}
          generateReleaseNotes: ${{ needs.release-setup.outputs.release_generate_release_notes }}
          name: ${{ needs.release-setup.outputs.release_tag }}
          prerelease: true
          tag: ${{ needs.release-setup.outputs.release_tag }}
          token: ${{ secrets.GH_BOT_TOKEN }}
          virustotal_api_key: ${{ secrets.VIRUSTOTAL_API_KEY }}

  fork-release:
    name: Fork Release
    # Jochona: fork-owned release job (separate from the LizardByte-gated `release` job above). Intentionally
    # does not depend on build-freebsd (FreeBSD aarch64 can take 1h+) or build-archlinux/build-docker/
    # build-homebrew (not part of this fork's release assets) so those never block publishing.
    if: needs.release-setup.outputs.fork_release == 'true'
    needs:
      - release-setup
      - build-windows
      - build-macos
      - build-linux
      - build-linux-flatpak
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          path: artifacts
          pattern: build-*
          merge-multiple: true

      - name: Prune non-release artifacts
        working-directory: artifacts
        run: |
          # debug symbols and the flatpak debug/source bundles aren't release-facing assets
          rm -f ./*-debuginfo.7z ./sunshine_debug_*.flatpak ./flathub.tar.gz
          ls -l .

      - name: Generate checksums
        working-directory: artifacts
        run: sha256sum -- * > SHA256SUMS

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.release-setup.outputs.release_tag }}
          RELEASE_COMMIT: ${{ needs.release-setup.outputs.release_commit }}
        run: |
          gh release create "${RELEASE_TAG}" artifacts/* \
            --repo "${GITHUB_REPOSITORY}" \
            --title "${RELEASE_TAG}" \
            --target "${RELEASE_COMMIT}" \
            --notes "Unsigned binaries; install instructions: docs/getting_started.md" \
            --generate-notes

  release-homebrew-beta:
    name: Release Homebrew Beta
    if:
      needs.release-setup.outputs.publish_release == 'true' &&
      startsWith(github.repository, 'LizardByte/')
    needs:
      - release-setup
      - build-homebrew
      - release
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Download homebrew artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: beta-Homebrew
          path: homebrew

      - name: Upload Homebrew Beta Formula
        uses: LizardByte/actions/actions/release_homebrew@master  # action requires too many updates to pin
        with:
          actionlint_config: "---\n# empty config"
          formula_file: ${{ github.workspace }}/homebrew/sunshine-beta.rb
          git_email: ${{ secrets.GH_BOT_EMAIL }}
          git_username: ${{ vars.GH_BOT_NAME }}
          publish: true
          token: ${{ secrets.GH_BOT_TOKEN }}
          validate: false
